nc: 11  # number of classes
scales:
  # [depth, width, max_channels]
  n: [1.0, 1.0, 512]  # 增大 max_channels 以提升特征容量

# 改进的混合型 Backbone
backbone:
  # [from, repeats, module, args]
  -  [-1, 1, GhostBottleneck, [32, 3, 2]] # P0/2 (HW下采样2倍)
  -  [-1, 1, EMA, [32,32]]  # 添加轻量级EMA注意力

  - [-1, 1, GhostBottleneck, [32, 3, 2]]  # P1/4
  - [-1, 1, ChannelAttention, [32]]  # 添加通道注意力

  - [-1, 1, MobileNetV3_BLOCK, [64, 5, 128, True, "HS", 2]]  # P3/8
  - [-1, 1, CBAM, [64,7]]  # 空间+通道注意力

  - [-1, 1, MobileNetV3_BLOCK, [96, 5, 256, True, "RE", 2]]  # P4/16
  - [-1, 1, CBAM, [96,7]]

  - [-1, 1, MobileNetV3_BLOCK, [96, 5, 256, True, "RE", 2]]  # P5/32
#  - [-1, 1, ASPP, [96,96]]  # 多尺度空洞空间金字塔
  - [-1, 1, TOPKSPP, [96, 5]]  # 改进的稀疏金字塔池化

# 增强型特征金字塔网络
head:
  # ----------- 上采样分支 (高分辨率) -----------
  - [-1, 1, CARAFE, [96, 3]]  # 可学习的上采样
  - [ [ -1, 6 ], 1, Concat, [ 1 ] ] # cat backbone P4 11
  - [ -1, 2, C3k2, [ 128, False ] ] # 12

  - [-1, 1, CARAFE, [128, 3]]  # 可学习的上采样
  - [ [ -1, 4 ], 1, Concat, [ 1 ] ] # cat backbone P3
  - [ -1, 2, C3k2, [128, False ] ] # 15 (P3/8-small)

  - [ -1, 1, Conv, [ 256, 3, 2 ] ]
  - [ [ -1, 12 ], 1, Concat, [ 1 ] ] # cat head P4
  - [ -1, 2, C3k2, [ 512, False ] ] # 18 (P4/16-medium)

  - [ -1, 1, Conv, [ 512, 3, 2 ] ]
  - [ [ -1, 9 ], 1, Concat, [ 1 ] ] # cat head P5
  - [ -1, 2, C3k2, [ 512, True ] ] # 21 (P5/32-large)

  # ----------- 多尺度检测头 -----------
  - [9, 1, EMSSHead, [96, 3]]  # 低层级特征增强
  - [15, 1, EMSSHead, [128, 3]]
  - [21, 1, EMSSHead, [512, 3]]

  # 检测头配置
  - [[22, 23, 24], 1,  Detect, [nc]]