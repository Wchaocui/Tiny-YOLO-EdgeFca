# Ultralytics YOLO 🚀, AGPL-3.0 license
# RT-DETR-ResNet18 object detection model with P3-P5 outputs.
# ResNet-18: [2, 2, 2, 2] blocks, channels [64, 128, 256, 512]

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  # ResNetLayer args: [c1, c2, s, is_first, n, e, block_type]
  - [-1, 1, ResNetLayer18, [3, 64, 1, True, 1, 1, "basic"]]    # 0  conv1 + maxpool, output: 64
  - [-1, 1, ResNetLayer18, [64, 64, 1, False, 2, 1, "basic"]]  # 1  layer1, 2 blocks, output: 64
  - [-1, 1, ResNetLayer18, [64, 128, 2, False, 2, 1, "basic"]] # 2  layer2, 2 blocks, output: 128  (P3)
  - [-1, 1, ResNetLayer18, [128, 256, 2, False, 2, 1, "basic"]] # 3  layer3, 2 blocks, output: 256 (P4)
  - [-1, 1, ResNetLayer18, [256, 512, 2, False, 2, 1, "basic"]] # 4  layer4, 2 blocks, output: 512 (P5)

head:
  # P5 分支
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 5  512->256
  - [-1, 1, AIFI, [512, 8]]                         # 6  AIFI, embed_dim=512 (匹配backbone输出)
  - [-1, 1, Conv, [256, 1, 1]]                      # 7  512->256, Y5

  # P4 上采样分支
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 8  上采样 Y5
  - [3, 1, Conv, [256, 1, 1, None, 1, 1, False]]     # 9  256->256 (来自layer3/P4)
  - [[-2, -1], 1, Concat, [1]]                        # 10 cat Y5_up + P4
  - [-1, 3, RepC3, [256]]                             # 11 X4 (FPN block 1)
  - [-1, 1, Conv, [256, 1, 1]]                        # 12 Y4

  # P3 上采样分支
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]        # 13 上采样 Y4
  - [2, 1, Conv, [256, 1, 1, None, 1, 1, False]]     # 14 128->256 (来自layer2/P3)
  - [[-2, -1], 1, Concat, [1]]                        # 15 cat Y4_up + P3
  - [-1, 3, RepC3, [256]]                             # 16 X3 (FPN block 2), P3输出

  # P4 下采样分支 (PAN)
  - [-1, 1, Conv, [256, 3, 2]]                        # 17 downsample_convs.0
  - [[-1, 12], 1, Concat, [1]]                       # 18 cat downsample + Y4
  - [-1, 3, RepC3, [256]]                             # 19 F4 (PAN block 0), P4输出

  # P5 下采样分支 (PAN)
  - [-1, 1, Conv, [256, 3, 2]]                        # 20 downsample_convs.1
  - [[-1, 7], 1, Concat, [1]]                        # 21 cat downsample + Y5
  - [-1, 3, RepC3, [256]]                             # 22 F5 (PAN block 1), P5输出

  # Detection
  - [[16, 19, 22], 1, RTDETRDecoder, [nc]]           # 23 Detect(P3, P4, P5)