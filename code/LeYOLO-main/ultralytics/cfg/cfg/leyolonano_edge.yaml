nc: 11  # number of classes
scales: 
  # [depth, width, max_channels]
  n: [1.0, 1.0, 576] 

# LeYOLO Nano backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, mn_conv, [16, 3, 2, "SI"]]  #0-P0;P1/2
  - [-1, 1, mn_conv, [16, 1, 1, "SI"]]  #1-P1;P1
  - [-1, 1, MobileNetV3_BLOCK, [16, 3, 16, False, "SI", 2, False]]   #2-P1;P2/4
  - [-1, 1, MobileNetV3_BLOCK, [32, 3, 96, False, "SI", 2]]  #3-P2;P3/8
  - [-1, 1, MobileNetV3_BLOCK, [32, 3, 96, False, "SI", 1]]  #4-P2;P3
  - [-1, 1, MobileNetV3_BLOCK, [64, 5, 96, True, "SI", 2]]   #5-P3;P4/16
  - [-1, 1, MobileNetV3_BLOCK, [64, 5, 192, True, "SI", 1]]  #6 P4;P4
  - [-1, 1, MobileNetV3_BLOCK, [64, 5, 192, True, "SI", 1]]  #7 P4;P4
  - [-1, 1, MobileNetV3_BLOCK, [64, 5, 192, True, "SI", 1]]  #8 P4;P4
  - [-1, 1, MobileNetV3_BLOCK, [64, 5, 192, True, "SI", 1]]  #9-P4;P4

  - [-1, 1, MobileNetV3_BLOCK, [96, 5, 576, True, "SI", 2]]  #10-P4;P5/32
  - [-1, 1, MobileNetV3_BLOCK, [96, 5, 576, True, "SI", 1]]  #11 P5;P5
  - [-1, 1, MobileNetV3_BLOCK, [96, 5, 576, True, "SI", 1]]  #12 P5;P5
  - [-1, 1, MobileNetV3_BLOCK, [96, 5, 576, True, "SI", 1]]  #13 P5;P5

  - [-1, 1, SPPF, [96, 5]]          #14-P5;P5
  - [ -1, 1, EdgeFcaV2,[96,20]]
  
# LeYOLO Nano head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] #16-P4
  - [[-1, 9], 1, Concat, [1]]  #17 cat backbone P4

  - [-1, 1, MobileNetV3_BLOCK, [64, 5, 128, True, "SI", 1]] #
  - [-1, 1, MobileNetV3_BLOCK, [64, 5, 128, True, "SI", 1]] #
  - [-1, 1, MobileNetV3_BLOCK, [64, 5, 128, True, "SI", 1]] #20-

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] #21-P3
  - [[-1, 4], 1, Concat, [1]]  # cat backbone P3 #22
  - [-1, 1, MobileNetV3_BLOCK, [32, 3, 96, True, "SI", 1, False]] #23
  - [-1, 1, MobileNetV3_BLOCK, [32, 3, 64, True, "SI", 1]] #24
  - [-1, 1, MobileNetV3_BLOCK, [32, 3, 64, True, "SI", 1]] #25-P3/SMALL
##
  - [-1, 1, mn_conv, [64, 3, 2, "SI"]]#26
  - [[-1, 20], 1, Concat, [1]]  # cat head P4 #
  - [-1, 1, MobileNetV3_BLOCK, [64, 5, 128, True, "SI", 1]]
  - [-1, 1, MobileNetV3_BLOCK, [64, 5, 128, True, "SI", 1]] #
  - [-1, 1, MobileNetV3_BLOCK, [64, 5, 128, True, "SI", 1]] #30-P4/MEDIUM



  - [-1, 1, mn_conv, [96, 3, 2, "SI"]] #31
  - [[-1, 15], 1, Concat, [1]]  # cat head P5

  - [-1, 1, MobileNetV3_BLOCK, [96, 5, 192, True, "SI", 1]] #
  - [-1, 1, MobileNetV3_BLOCK, [96, 5, 192, True, "SI", 1]] #
  - [-1, 1, MobileNetV3_BLOCK, [96, 5, 192, True, "SI", 1]] #35-P5/LARGE

  - [[25, 30, 35], 1, Detect, [nc]]  # Detect(P3, P4, P5)
